<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThorStation — AYN Thor App & OS Vault</title>
  <!-- Google Fonts: Roboto & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    /* Material 3 Expressive Theme (Dark Dynamic Tones) */
    :root {
      --md-sys-color-bg: #0f141c;
      --md-sys-color-surface: #181c24;
      --md-sys-color-surface-container: #1f242f;
      --md-sys-color-surface-high: #292e3b;
      --md-sys-color-primary: #a8c7ff;
      --md-sys-color-on-primary: #003062;
      --md-sys-color-primary-container: #004789;
      --md-sys-color-on-primary-container: #d6e3ff;
      --md-sys-color-secondary: #70d2ff;
      --md-sys-color-secondary-container: #004d67;
      --md-sys-color-on-secondary-container: #cbeeef;
      --md-sys-color-text: #e2e2e9;
      --md-sys-color-text-variant: #c4c6d0;
      --md-sys-color-outline: #44474f;
      --md-sys-shape-full: 9999px;
      --md-sys-shape-card: 24px;
      --md-sys-shape-btn: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background-color: var(--md-sys-color-bg);
      color: var(--md-sys-color-text);
      line-height: 1.5;
      padding-bottom: 5rem;
    }

    /* Hero Section (Material 3 Expressive Header) */
    header {
      background: linear-gradient(135deg, #181c24 0%, #0f141c 100%);
      padding: 4rem 1.5rem 3rem;
      text-align: center;
      position: relative;
    }

    .badge-expressive {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      padding: 0.35rem 1.25rem;
      border-radius: var(--md-sys-shape-full);
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
      letter-spacing: 0.03em;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #a8c7ff, #70d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }

    header p {
      color: var(--md-sys-color-text-variant);
      max-width: 620px;
      margin: 0 auto;
      font-size: 1.1rem;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin: 2.5rem 0;
    }

    @media (min-width: 768px) {
      .controls {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    /* M3 Expressive Search Bar */
    .search-box {
      display: flex;
      align-items: center;
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-full);
      padding: 0.4rem 1.25rem;
      flex: 1;
      max-width: 420px;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .search-box:focus-within {
      border-color: var(--md-sys-color-primary);
      background: var(--md-sys-color-surface-high);
      box-shadow: 0 0 0 4px rgba(168, 199, 255, 0.15);
    }

    .search-box span {
      color: var(--md-sys-color-text-variant);
      margin-right: 0.5rem;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--md-sys-color-text);
      width: 100%;
      font-size: 1rem;
    }

    /* Filter Chips (M3 Expressive Filter Chips) */
    .chip-group {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.4rem;
    }

    .chip {
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-text-variant);
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: var(--md-sys-shape-btn);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chip:hover {
      background: var(--md-sys-color-surface-high);
      color: var(--md-sys-color-text);
      transform: translateY(-1px);
    }

    .chip.active {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-weight: 700;
    }

    /* Grid & M3 Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-card);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.01);
      background: var(--md-sys-color-surface-high);
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.4);
    }

    .card-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.3rem 0.8rem;
      border-radius: var(--md-sys-shape-full);
      background: rgba(255, 255, 255, 0.06);
      color: var(--md-sys-color-secondary);
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--md-sys-color-text);
      margin-bottom: 0.5rem;
    }

    .card-desc {
      color: var(--md-sys-color-text-variant);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .upvote-btn {
      background: var(--md-sys-color-surface);
      border: none;
      color: var(--md-sys-color-text);
      padding: 0.4rem 0.9rem;
      border-radius: var(--md-sys-shape-full);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .upvote-btn:hover {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .upvote-btn span.material-symbols-outlined {
      font-size: 1.2rem;
    }

    .card-link {
      color: var(--md-sys-color-primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      transition: gap 0.2s;
    }

    .card-link:hover {
      gap: 0.5rem;
    }

    /* M3 Floating Action Button (FAB) */
    .fab {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      padding: 1rem 1.5rem;
      border-radius: var(--md-sys-shape-card);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      z-index: 90;
    }

    .fab:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 24px rgba(0,0,0,0.5);
    }

    /* M3 Expressive Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--md-sys-color-surface-container);
      border-radius: 28px;
      width: 90%;
      max-width: 520px;
      padding: 2rem;
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-header h3 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--md-sys-color-text-variant);
      cursor: pointer;
      border-radius: var(--md-sys-shape-full);
      padding: 0.4rem;
      display: flex;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--md-sys-color-text-variant);
      margin-bottom: 0.4rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: var(--md-sys-color-bg);
      border: 1px solid var(--md-sys-color-outline);
      color: var(--md-sys-color-text);
      padding: 0.8rem 1rem;
      border-radius: var(--md-sys-shape-btn);
      outline: none;
      font-size: 0.95rem;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--md-sys-color-primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      padding: 0.9rem;
      border-radius: var(--md-sys-shape-btn);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #c2d9ff;
    }

    footer {
      text-align: center;
      color: var(--md-sys-color-text-variant);
      margin-top: 5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-expressive">
      <span class="material-symbols-outlined" style="font-size: 1.1rem;">electric_bolt</span> AYN Thor Hub
    </div>
    <h1>ThorStation</h1>
    <p>Discover apps, custom OS builds, dual-screen setups, and TDP power profiles.</p>
  </header>

  <main class="container">
    <div class="controls">
      <div class="search-box">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="searchInput" placeholder="Search resources..." oninput="filterItems()">
      </div>
      <div class="chip-group">
        <button class="chip active" onclick="setCategory('all', this)">
          <span class="material-symbols-outlined">grid_view</span> All
        </button>
        <button class="chip" onclick="setCategory('apps', this)">
          <span class="material-symbols-outlined">sports_esports</span> Apps
        </button>
        <button class="chip" onclick="setCategory('os', this)">
          <span class="material-symbols-outlined">terminal</span> Custom OS
        </button>
        <button class="chip" onclick="setCategory('dual-screen', this)">
          <span class="material-symbols-outlined">devices_fold</span> Dual-Screen
        </button>
        <button class="chip" onclick="setCategory('tdp', this)">
          <span class="material-symbols-outlined">battery_charging_full</span> TDP
        </button>
      </div>
    </div>

    <div class="grid" id="itemGrid"></div>
  </main>

  <!-- M3 Floating Action Button -->
  <button class="fab" onclick="openModal()">
    <span class="material-symbols-outlined">add</span>
    <span>Submit</span>
  </button>

  <!-- Submit Modal -->
  <div class="modal" id="submitModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Submit Resource</h3>
        <button class="close-btn" onclick="closeModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="submitForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" required placeholder="e.g. Citra Dual-Screen Layout">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="apps">Apps & Emulators</option>
            <option value="os">Custom OS</option>
            <option value="dual-screen">Dual-Screen Layout</option>
            <option value="tdp">TDP Profile</option>
          </select>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3" required placeholder="Describe the configuration or download..."></textarea>
        </div>
        <div class="form-group">
          <label for="link">URL / Link</label>
          <input type="url" id="link" required placeholder="https://...">
        </div>
        <button type="submit" class="btn-submit">Submit Entry</button>
      </form>
    </div>
  </div>

  <footer>
    <p>ThorStation — Community Resource for r/AynThor</p>
  </footer>

  <script>
    let items = [
      { id: 1, title: 'Citra 3DS Dual-Screen Layout', category: 'dual-screen', desc: 'Pre-configured screen mapping for seamless top & bottom display on AYN Thor.', votes: 42, link: '#' },
      { id: 2, title: 'Batocera Linux Build', category: 'os', desc: 'SD-card bootable Linux OS optimized for dual-display handheld retro gaming.', votes: 38, link: '#' },
      { id: 3, title: 'Turnip GPU Driver v24.1.0', category: 'apps', desc: 'Vulkan graphics drivers yielding peak FPS performance in Switch emulation.', votes: 29, link: '#' },
      { id: 4, title: '12W Balanced TDP Profile', category: 'tdp', desc: 'Power preset optimized for 60FPS GameCube & PS2 with battery optimization.', votes: 19, link: '#' },
      { id: 5, title: 'DraStic NDS Screen Profiles', category: 'dual-screen', desc: 'Touch-calibrated aspect ratios and layout presets for NDS games.', votes: 15, link: '#' }
    ];

    let currentCategory = 'all';

    function renderItems() {
      const grid = document.getElementById('itemGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = items.filter(item => {
        const matchesCat = currentCategory === 'all' || item.category === currentCategory;
        const matchesSearch = item.title.toLowerCase().includes(search) || item.desc.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div>
            <span class="card-tag">${item.category}</span>
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc}</div>
          </div>
          <div class="card-footer">
            <button class="upvote-btn" onclick="upvote(${item.id})">
              <span class="material-symbols-outlined">expand_less</span>
              <span>${item.votes}</span>
            </button>
            <a href="${item.link}" target="_blank" class="card-link">
              View <span class="material-symbols-outlined" style="font-size: 1.1rem;">arrow_forward</span>
            </a>
          </div>
        </div>
      `).join('');
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderItems();
    }

    function filterItems() {
      renderItems();
    }

    function upvote(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.votes++;
        renderItems();
      }
    }

    function openModal() {
      document.getElementById('submitModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('submitModal').classList.remove('active');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const newItem = {
        id: Date.now(),
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        desc: document.getElementById('description').value,
        link: document.getElementById('link').value,
        votes: 1
      };
      items.unshift(newItem);
      renderItems();
      closeModal();
      document.getElementById('submitForm').reset();
    }

    renderItems();
  </script>
</body>
</html>
