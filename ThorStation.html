<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThorStation — AYN Thor App & OS Vault</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 3rem;
    }

    header {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 3rem 1.5rem 2rem;
      text-align: center;
    }

    .badge {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 1.5rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 2rem 0;
    }

    @media (min-width: 640px) {
      .controls {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-bar {
      flex: 1;
      max-width: 400px;
    }

    .search-bar input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--accent);
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn:hover, .btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 0.25rem;
      color: var(--text-muted);
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }

    .upvote-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.3rem 0.6rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .upvote-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .card-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .card-link:hover {
      text-decoration: underline;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      width: 100%;
      max-width: 500px;
      padding: 1.5rem;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 0.375rem;
      outline: none;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      margin-top: 4rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">AYN Thor Vault</span>
    <h1>⚡ ThorStation</h1>
    <p>The community directory for Apps, Custom OS builds, Dual-Screen setups, and TDP Profiles.</p>
    <button class="btn btn-primary" onclick="openModal()">+ Submit Item</button>
  </header>

  <main class="container">
    <div class="controls">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search apps, OS, configs..." oninput="filterItems()">
      </div>
      <div class="filters">
        <button class="btn active" onclick="setCategory('all', this)">All</button>
        <button class="btn" onclick="setCategory('apps', this)">Apps</button>
        <button class="btn" onclick="setCategory('os', this)">Custom OS</button>
        <button class="btn" onclick="setCategory('dual-screen', this)">Dual-Screen</button>
        <button class="btn" onclick="setCategory('tdp', this)">TDP Profiles</button>
      </div>
    </div>

    <div class="grid" id="itemGrid"></div>
  </main>

  <!-- Submit Modal -->
  <div class="modal" id="submitModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Submit to ThorStation</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="submitForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" required placeholder="e.g. Citra Dual-Screen Layout">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="apps">Apps & Emulators</option>
            <option value="os">Custom OS</option>
            <option value="dual-screen">Dual-Screen Layout</option>
            <option value="tdp">TDP Profile</option>
          </select>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3" required placeholder="Brief explanation of the setup or software..."></textarea>
        </div>
        <div class="form-group">
          <label for="link">URL / Link</label>
          <input type="url" id="link" required placeholder="https://...">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Entry</button>
      </form>
    </div>
  </div>

  <footer>
    <p>ThorStation — Built for the r/AynThor Community</p>
  </footer>

  <script>
    let items = [
      { id: 1, title: 'Citra 3DS Dual-Screen Setup', category: 'dual-screen', desc: 'Pre-configured screen mapping for top/bottom display layout on AYN Thor.', votes: 42, link: '#' },
      { id: 2, title: 'Batocera Linux Build', category: 'os', desc: 'Standalone SD-card bootable Linux OS with EmulationStation interface.', votes: 38, link: '#' },
      { id: 3, title: 'Turnip GPU Driver v24.1.0', category: 'apps', desc: 'Latest Vulkan drivers optimized for Adreno GPUs in Switch emulation.', votes: 29, link: '#' },
      { id: 4, title: '12W Balanced TDP Profile', category: 'tdp', desc: 'Optimal power preset balancing PS2/GameCube performance and battery life.', votes: 19, link: '#' },
      { id: 5, title: 'DraStic NDS Layout Presets', category: 'dual-screen', desc: 'Touch-calibrated layout profiles for original Nintendo DS aspect ratio.', votes: 15, link: '#' }
    ];

    let currentCategory = 'all';

    function renderItems() {
      const grid = document.getElementById('itemGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = items.filter(item => {
        const matchesCat = currentCategory === 'all' || item.category === currentCategory;
        const matchesSearch = item.title.toLowerCase().includes(search) || item.desc.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div>
            <div class="card-header">
              <div class="card-title">${item.title}</div>
              <span class="card-category">${item.category}</span>
            </div>
            <div class="card-desc">${item.desc}</div>
          </div>
          <div class="card-footer">
            <button class="upvote-btn" onclick="upvote(${item.id})">
              ▲ <span>${item.votes}</span>
            </button>
            <a href="${item.link}" target="_blank" class="card-link">View Details →</a>
          </div>
        </div>
      `).join('');
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filters .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderItems();
    }

    function filterItems() {
      renderItems();
    }

    function upvote(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.votes++;
        renderItems();
      }
    }

    function openModal() {
      document.getElementById('submitModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('submitModal').classList.remove('active');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const newItem = {
        id: Date.now(),
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        desc: document.getElementById('description').value,
        link: document.getElementById('link').value,
        votes: 1
      };
      items.unshift(newItem);
      renderItems();
      closeModal();
      document.getElementById('submitForm').reset();
    }

    // Initial render
    renderItems();
  </script>
</body>
</html>
